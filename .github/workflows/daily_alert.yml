name: Daily SPY Trend Alert

on:
  schedule:
    # Runs at 13:00 UTC every Monday to Friday (9:00 AM EST)
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  run-prediction-and-alert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy scikit-learn

    - name: Run Notifier Engine
      env:
        ALERT_SENDER_EMAIL: ${{ secrets.ALERT_SENDER_EMAIL }}
        ALERT_SENDER_PASSWORD: ${{ secrets.ALERT_SENDER_PASSWORD }}
        ALERT_RECIPIENT_EMAILS: ${{ secrets.ALERT_RECIPIENT_EMAILS }}
      run: |
        python notifier.py
