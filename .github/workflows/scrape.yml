name: Alternative Data Scraper Pipeline

on:
  push:
    branches:
      - main
  schedule:
    # Run every hour at the top of the hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need write permission to commit back to the repo
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Cache pip dependencies for faster runs
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Data Pipeline
      env:
        AVIATION_KEY: ${{ secrets.AVIATION_KEY }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: python data_pipeline.py
        
    - name: Commit and push updated database and CSVs
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add alt_data.db *.csv
        # Only commit if there are actual changes
        git commit -m "Automated data pipeline run (DB + CSVs) [skip ci]" || echo "No changes to commit"
        git push
